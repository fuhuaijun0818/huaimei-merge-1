      HUAMEI_FORMAL_CAPACITY_ATTESTATION_SHA256: "${HUAMEI_FORMAL_CAPACITY_ATTESTATION_SHA256:?Set the signed capacity observability attestation SHA-256}"
      HUAMEI_FORMAL_EVALUATION_ENDPOINT_REGISTRY_PATH: /release-target/evaluation-endpoints.json
      HUAMEI_FORMAL_EVALUATION_ENDPOINT_REGISTRY_SHA256: "${HUAMEI_FORMAL_EVALUATION_ENDPOINT_REGISTRY_SHA256:?Set the controlled formal-evaluation endpoint registry SHA-256}"
      HUAMEI_FORMAL_EVIDENCE_TRUSTED_SIGNERS_B64: "${HUAMEI_FORMAL_EVIDENCE_TRUSTED_SIGNERS_B64:?Set the externally controlled trusted evidence signer registry}"
      HUAMEI_FORMAL_LOAD_TAXONOMY_MANIFEST_SHA256: "${HUAMEI_FORMAL_LOAD_TAXONOMY_MANIFEST_SHA256:?Set the signed formal-load taxonomy manifest SHA-256 used by the capacity evidence}"
    volumes:
      - "${HUAMEI_RELEASE_EVIDENCE_HOST_PATH:?Set the controlled release-evidence directory}:/release-evidence:ro"
      - "${HUAMEI_FORMAL_EVALUATION_ENDPOINT_REGISTRY_HOST_PATH:?Set the controlled formal-evaluation endpoint registry file}:/release-target/evaluation-endpoints.json:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      - backend

  caddy:
    image: "${HUAMEI_CADDY_IMAGE:?Set an immutable Caddy image reference ending in @sha256:<digest>}"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_SITE_ADDRESS: "${PUBLIC_SITE_ADDRESS:?Set a domain or :80 in deploy/.env}"
      ADMIN_SITE_ADDRESS: "${ADMIN_SITE_ADDRESS:?Set a separate management domain in deploy/.env}"
      HUAMEI_CANARY_TOKEN: "${HUAMEI_CANARY_TOKEN:?Set a random canary routing token of at least 32 characters}"
    ports:
      - "${HUAMEI_EDGE_BIND_ADDRESS:?Bind the edge to loopback or an approved private address}:${PUBLIC_HTTP_PORT:-80}:80"
      - "${HUAMEI_EDGE_BIND_ADDRESS:?Bind the edge to loopback or an approved private address}:${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.stop-ai:/etc/caddy/Caddyfile.stop-ai:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      proxy:
        ipv4_address: "${HUAMEI_CADDY_PROXY_IP:-172.31.254.2}"
      frontend:

networks:
  backend:
    internal: true
  proxy:
    internal: true
    ipam:
      config:
        - subnet: "${HUAMEI_PROXY_SUBNET:-172.31.254.0/28}"
  approved-egress:
  frontend:

volumes:
  postgres_data:
  redis_data:
  app_data:
  caddy_data:
  caddy_config:
