<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 华美管理后台</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf6f6;color:#392d30;font:16px system-ui,sans-serif;padding:24px}main{width:100%;max-width:420px;background:white;border:1px solid #ecdede;border-radius:24px;padding:40px;box-shadow:0 18px 70px #733b4010}.brand{color:#a04e5e;font-size:14px;letter-spacing:3px}h1{font-size:28px;margin:16px 0 8px}.intro,footer{color:#807277;font-size:14px;line-height:1.7}label{display:block;margin:22px 0 8px;font-size:14px}input{width:100%;height:46px;border:1px solid #d8c9cd;border-radius:9px;padding:0 12px;font:inherit}input:focus,button:focus-visible{outline:3px solid #dfb3be;outline-offset:2px}.password{display:flex;gap:8px}.password button{flex-shrink:0;border:1px solid #d8c9cd;background:white;border-radius:9px;color:#80515d;padding:0 12px}#submit{width:100%;margin-top:24px;background:#9c4d5f;color:white;border:0;border-radius:9px;height:46px;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#message{font-size:14px;line-height:1.6;min-height:23px;color:#a13248;margin:18px 0 0}footer{border-top:1px solid #eee3e6;padding-top:18px;margin-top:24px}a{color:#904b5c}@media(max-width:440px){main{padding:28px}}
</style><script defer src="/auth/login.js"></script></head><body><main><div class="brand">华美医疗 · 时代之美</div><h1>登录管理后台</h1><p class="intro">使用分配给您的账号，进入业务工作台。</p><form id="login-form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" maxlength="128" required autofocus><label for="password">密码</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="1024" required><button id="show-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div><button id="submit" type="submit">登录</button><p id="message" role="status" aria-live="polite"></p></form><footer>忘记密码或账号停用，请联系系统管理员处理。<br><a href="/advisor/">前往客户咨询页面</a></footer></main></body></html>
